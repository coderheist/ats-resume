services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: resume_optimizer
      POSTGRES_PASSWORD: dev_only_change_me
      POSTGRES_DB: resume_optimizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://resume_optimizer:dev_only_change_me@db:5432/resume_optimizer
      EMBEDDING_BACKEND: tfidf  # set to "sbert" once model weights are baked into the image
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}  # claude (default) | gemini | groq -- see README's "Multi-provider LLM switching"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OSS_EXTRACTION_BASE_URL: ${OSS_EXTRACTION_BASE_URL:-}  # e.g. https://api.groq.com/openai/v1 for the crosscheck task
      OSS_EXTRACTION_API_KEY: ${OSS_EXTRACTION_API_KEY:-}
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Serves frontend/ as static files -- nginx:alpine needs no Dockerfile
  # of its own, just a read-only bind mount. Published on :5500 to match
  # CORS_ALLOWED_ORIGINS above (and app/main.py's own default) exactly,
  # so the console works with zero extra config the moment this is up.
  frontend:
    image: nginx:alpine
    depends_on:
      - api
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "5500:80"

volumes:
  pgdata:
