services:
  # Local Postgres+pgvector for development/testing convenience --
  # migrations were applied and verified directly against this exact
  # image's engine. Note that running pytest does NOT exercise this
  # engine: the DB-touching tests override get_db with an in-memory
  # SQLite session per test for isolation. For a real deployment,
  # point DATABASE_URL (below) at a hosted Postgres instead -- this repo
  # is set up for Supabase specifically (see .env.example's Database
  # section for connection-string/pooler-mode/pgvector-extension setup),
  # and this `db` service can simply be omitted once you do.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: resume_optimizer
      POSTGRES_PASSWORD: dev_only_change_me
      POSTGRES_DB: resume_optimizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      # Local dev default (the `db` service above). Swap for your
      # Supabase connection string in a real deployment -- see
      # .env.example.
      DATABASE_URL: ${DATABASE_URL:-postgresql://resume_optimizer:dev_only_change_me@db:5432/resume_optimizer}
      EMBEDDING_BACKEND: tfidf  # set to "sbert" once model weights are baked into the image
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500,http://localhost:5174,http://localhost:5175}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}  # gemini (default) | groq | claude -- see README's "Multi-provider LLM switching"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OSS_EXTRACTION_BASE_URL: ${OSS_EXTRACTION_BASE_URL:-}  # e.g. https://api.groq.com/openai/v1 for the crosscheck task
      OSS_EXTRACTION_API_KEY: ${OSS_EXTRACTION_API_KEY:-}
      # Genuinely optional -- see app/core/auth/firebase_auth.py. Unset
      # means /auth/me and /history return a clear 503; every other
      # endpoint is unaffected.
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Serves frontend/ (the vanilla console) as static files -- nginx:alpine
  # needs no Dockerfile of its own, just a read-only bind mount. Published
  # on :5500 to match CORS_ALLOWED_ORIGINS above (and app/main.py's own
  # default) exactly, so the console works with zero extra config the
  # moment this is up.
  frontend:
    image: nginx:alpine
    depends_on:
      - api
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "5500:80"

  # The React app (frontend-react/) -- unlike frontend/ above, this
  # genuinely needs a build step (Vite/JSX aren't servable as static
  # files directly), hence its own Dockerfile (multi-stage: node build ->
  # nginx serve). Published on :5174 to match CORS_ALLOWED_ORIGINS.
  # NOTE: not verified end-to-end in this environment -- no Docker daemon
  # available in the sandbox this was built in. The underlying `npm ci &&
  # npm run build` steps this Dockerfile runs were verified directly
  # (repeatedly, throughout this project's frontend-react work); the
  # container build/serve step itself was not. Worth a real `docker
  # compose up` check before relying on this in production.
  frontend-react:
    build:
      context: ./frontend-react
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    depends_on:
      - api
    ports:
      - "5174:80"

volumes:
  pgdata:
